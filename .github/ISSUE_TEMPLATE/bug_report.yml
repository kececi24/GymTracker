name: Bug Report
description: Report a bug in the backend API, mobile app, or CI/Docker setup
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of GymTracker is affected?
      options:
        - Backend (backend/)
        - Mobile (mobile/)
        - CI / Docker (.github/, compose.yaml)
        - Documentation (docs/)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this issue?
      placeholder: |
        1. Start the backend with `docker compose up` (or open screen X in the app)
        2. Send request / tap button ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Logs
      description: OS, Flutter/Android emulator version, .NET version, or relevant logs/screenshots.
      placeholder: |
        - OS:
        - Component version (e.g. Android API level, Docker):
        - Relevant logs:
